# Every push and pull request: formatting, unit tests, and the static binary that goes into the image.
name: ci
on:
  push:
  pull_request:
    branches: [main]

jobs:
  rust:
    name: ci
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: daimon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get install -y -q musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daimon
      - name: Format (daimon/rustfmt.toml, 160 columns)
        run: cargo fmt --check
      - name: Unit tests
        run: cargo test
      - name: Static binary (as in the image)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          ls -la target/x86_64-unknown-linux-musl/release/daimon
